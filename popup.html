<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收藏到我的导航</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header><img src="icons/48.png" width="38" height="38" alt=""><div><h1>收藏到我的导航</h1><p>让好用的网站，下次更容易找到。</p></div></header>
  <main>
    <div class="onboarding" id="onboarding">首次使用：登录或注册 → 备份 Token → 保存第一个网页。</div>
    <section id="loginSection" hidden>
      <form id="loginForm">
        <label for="token">导航 Token</label>
        <input id="token" type="password" autocomplete="off" required placeholder="输入你在导航网站使用的 Token">
        <p class="hint">首次连接后会记住登录信息，仅保存在当前浏览器。</p>
        <button class="primary" id="loginButton" type="submit">连接我的导航</button>
      </form>
      <button class="secondary" id="showRegisterButton" type="button">没有 Token？注册并生成</button>
    </section>
    <section id="registerSection" hidden>
      <h2>创建自己的导航</h2>
      <p class="hint">填写名称即可生成 Token，并创建「我的收藏」分组。</p>
      <form id="registerForm">
        <label for="registerName">导航名称</label>
        <input id="registerName" required maxlength="40" placeholder="例如：小林的导航" autocomplete="nickname">
        <p class="hint">Token 是你的登录凭据。注册成功后请备份，换设备时需要使用。</p>
        <button class="primary" id="registerButton" type="submit">注册并生成 Token</button>
      </form>
      <button class="text back-link" id="backToLoginButton" type="button">已有 Token，返回登录</button>
    </section>
    <section id="backupSection" hidden>
      <h2>备份你的 Token</h2>
      <p class="hint">已保存在当前浏览器。请另存一份，用于网站登录或更换设备；没有绑定邮箱，丢失后无法自助找回。</p>
      <label for="backupToken">登录 Token</label>
      <input id="backupToken" type="password" readonly autocomplete="off">
      <div class="token-actions"><button id="revealTokenButton" type="button" class="text">显示 Token</button><button id="copyTokenButton" type="button" class="text">复制 Token</button></div>
      <button id="finishBackupButton" type="button" class="primary">已备份，开始收藏</button>
    </section>
    <section id="bookmarkSection" hidden>
      <div class="account"><span id="accountName"></span><div class="account-actions"><button id="backupTokenButton" class="text" type="button">备份 Token</button><button id="logoutButton" class="text" type="button">退出</button></div></div>
      <form id="bookmarkForm">
        <fieldset id="bookmarkFields">
          <p id="duplicateHint" class="hint" hidden></p>
          <button id="saveButton" class="primary" type="submit">保存当前网页</button>
        </fieldset>
      </form>
    </section>
    <div id="status" role="status" aria-live="polite"><span id="spinner" hidden></span><span id="statusText">正在准备…</span></div>
    <button id="retryButton" type="button" class="secondary" hidden>重新加载</button>
  </main>
  <div class="preferences"><a id="helpLink" href="https://home.zhaoyouning.com/help/" target="_blank" rel="noopener">帮助</a><a id="privacyLink" href="https://home.zhaoyouning.com/privacy/" target="_blank" rel="noopener">隐私</a></div>
  <footer><a href="https://home.zhaoyouning.com/" target="_blank" rel="noopener noreferrer">打开我的导航 ↗</a><span>只收藏你选择的网页</span></footer>
</body>
</html>
